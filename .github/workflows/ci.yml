name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Lightweight checks only. No live provider calls and no secret access.
# cargo test is documented for local use so this workflow stays within a small Actions budget.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- dist
